<text class="t-slate" x="600" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2.5" fill="#3E5C6B" font-weight="600">CRAFT</text>
<text class="t-body" x="600" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#24292F" opacity="0.75">six conditions a chain must satisfy, each resting on the one before</text>
