<text class="t-ore" x="388" y="300" text-anchor="end" font-family="ui-monospace, monospace" font-size="15" letter-spacing="2.5" fill="#863A34" font-weight="600">ORE</text>
<text class="t-muted" x="388" y="319" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#6E7781">THE WAY IN</text>
<text class="t-body" x="388" y="386" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#24292F" opacity="0.75">what may be assumed</text>
<text class="t-body" x="388" y="401" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#24292F" opacity="0.75">about what enters</text>
<text class="t-slate" x="880" y="288" font-family="ui-monospace, monospace" font-size="15" letter-spacing="2.5" fill="#3E5C6B" font-weight="600">STRUCK</text>
<text class="t-muted" x="880" y="307" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#6E7781">THE WAY OUT</text>
<text class="t-body" x="880" y="392" font-family="system-ui, sans-serif" font-size="11.5" fill="#24292F" opacity="0.75">what the claim owes</text>
<text class="t-body" x="880" y="407" font-family="system-ui, sans-serif" font-size="11.5" fill="#24292F" opacity="0.75">before anyone acts</text>

<text class="t-body" x="600" y="437" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#24292F" opacity="0.65">feedback propagates back into the earlier conditions</text>
<text class="t-body" x="600" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#24292F" opacity="0.75">ORE and STRUCK are each usable on their own; the companion figure shows the pair with no CRAFT in the middle.</text>
<text class="t-body" x="600" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#24292F" opacity="0.75">A claim leaving through STRUCK may be the material for another CRAFT chain's ORE input.</text>
